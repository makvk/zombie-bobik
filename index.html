<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR - Zombie 3D Model</title>
    <!-- Библиотека Google model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* Кнопка запуска AR */
        .ar-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #e74c3c;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ar-button:hover {
            background: #c0392b;
            transform: translateX(-50%) scale(1.05);
        }

        .ar-button:active {
            transform: translateX(-50%) scale(0.98);
        }
    </style>
</head>
<body>

    <!-- 
      src: путь к файлу .glb (Android / браузер)
      ios-src: путь к файлу .usdz (iOS Quick Look)
      autoplay: автовоспроизведение анимации (ходьба/idle), если она есть в модели
      auto-rotate: плавное вращение в 3D-режиме
    -->
    <model-viewer src="Zombie.glb"
                  ios-src="Zombie.usdz"
                  alt="3D Модель Зомби"
                  ar
                  ar-modes="webxr scene-viewer quick-look"
                  camera-controls
                  auto-rotate
                  autoplay
                  environment-image="neutral"
                  shadow-intensity="1"
                  shadow-softness="0.8">

        <!-- Кнопка вызова AR режима -->
        <button slot="ar-button" class="ar-button">
            <span>🧟 Посмотреть в AR</span>
        </button>

    </model-viewer>

</body>
</html>
